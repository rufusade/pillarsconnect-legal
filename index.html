<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Pillars Connect</title>
<style>
:root {
  --bg: #FAFAFB; --surface: #FFFFFF; --text: #17181C; --muted: #55555A;
  --brass: #7A5718; --rule: #E6E3DC;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #050607; --surface: #121418; --text: #ECEDEF; --muted: #A4A7AE;
    --brass: #E3C77F; --rule: #24272D;
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 17px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
main { max-width: 720px; margin: 0 auto; padding: 48px 16px 64px; }
h1 { font: 700 32px/1.25 Georgia, "Times New Roman", serif; margin-bottom: 8px; }
h2 { font: 700 21px/1.3 Georgia, "Times New Roman", serif; margin: 36px 0 10px; }
p, ul { margin: 0 0 14px; }
ul { padding-left: 22px; }
li { margin-bottom: 6px; }
a { color: var(--brass); }
.updated { color: var(--muted); margin-bottom: 28px; }
nav { margin-bottom: 32px; font-size: 15px; }
nav a { margin-right: 16px; }
.card {
  background: var(--surface); border: 1px solid var(--rule);
  border-radius: 14px; padding: 18px 20px; margin-bottom: 14px;
}
.card a { font-weight: 600; text-decoration: none; }
footer { color: var(--muted); font-size: 14px; margin-top: 48px; }
</style>
</head>
<body>
<main>
<nav><a href="./">Pillars Connect</a><a href="terms.html">Terms of Use</a><a href="privacy.html">Privacy Policy</a></nav>

<h1>Pillars Connect</h1>
<p class="updated">The private messaging and calling app of Gospel Pillars International.</p>
<div class="card"><a href="terms.html">Terms of Use</a></div>
<div class="card"><a href="privacy.html">Privacy Policy</a></div>
<div class="card">Help and support: <a href="mailto:sundewale536@gmail.com">sundewale536@gmail.com</a></div>

<footer>Gospel Pillars International</footer>
</main>
</body>
</html>
